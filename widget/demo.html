<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embeddable Widget Demo — Inference on Demand</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container" style="max-width: 720px;">
    <div class="card p-4 shadow-sm">
      <h3 class="fw-bold mb-2">Host Application Integration Demo</h3>
      <p class="text-muted">
        This page demonstrates embedding <code>inference-widget.js</code> into an external application and listening to custom events on <code>window</code>.
      </p>

      <hr class="my-3">

      <h5 class="fw-semibold">1. Embedded Widget</h5>
      <div class="mb-4">
        <div id="inference-widget-container"></div>
      </div>

      <h5 class="fw-semibold">2. Host App Event Listener Output</h5>
      <div id="event-log" class="p-3 bg-dark text-light rounded font-monospace small" style="min-height: 120px;">
        <div>Listening for 'ollamaReady' and 'ollamaOffline' events...</div>
      </div>
    </div>
  </div>

  <script>
    // Listen for custom events dispatched by the widget
    window.addEventListener('ollamaReady', (event) => {
      const log = document.getElementById('event-log');
      const div = document.createElement('div');
      div.className = 'text-success mt-1';
      div.textContent = `[EVENT ollamaReady] Endpoint: ${event.detail.endpoint} (IP: ${event.detail.ip})`;
      log.appendChild(div);
    });

    window.addEventListener('ollamaOffline', () => {
      const log = document.getElementById('event-log');
      const div = document.createElement('div');
      div.className = 'text-danger mt-1';
      div.textContent = `[EVENT ollamaOffline] Compute has been terminated.`;
      log.appendChild(div);
    });
  </script>

  <!-- Embed Widget (Replace data-api-url and data-token with actual values) -->
  <script 
    src="inference-widget.js" 
    data-api-url="https://example.execute-api.ap-south-1.amazonaws.com" 
    data-token="YWRtaW46cGFzc3dvcmQ="
    data-container-id="inference-widget-container">
  </script>
</body>
</html>
